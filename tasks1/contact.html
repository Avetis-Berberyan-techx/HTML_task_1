<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>
    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="1" max="120"><br><br>
    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>
    <label for="topic">topic</label>
    <select id="topic" name="topic"><br><br>
        <option value="General">General</option>
        <option value="Support">Support</option>
        <option value="Feedback">Feedback</option>
    </select>
    <p>contact method</p>
    <input type="radio" id="Email" name="Email" value="Email">
    <label for="male">Email</label><br><br>
    <input type="radio" id="Phone" name="Phone" value="Phone">
    <label for="female">Phone</label><br><br>
    <input type="submit" value="Submit"><br><br>




</body>
</html>
