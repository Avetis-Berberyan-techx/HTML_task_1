<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIT University</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="media-page.css" />
  </head>

  <body>
    <!-- Header Section: Contains the main title of the page -->
    <header class="header">
      <h1 class="header__title">MIT University</h1>
    </header>

    <!-- Main Content Area: Contains all primary content sections -->
    <main class="main">
      <!-- MIT Section: Displays various media related to MIT -->
      <section class="mit-section">
        <!-- First Image: Main MIT image from external URL -->
        <img
          class="mit-section__image mit-section__image--first"
          src="https://miro.medium.com/1*no3HdwzY9jTMSdyv6kV3-A.jpeg"
          alt="MIT image"
          title="AI Intro"
        />
        <br /><br />

        <!-- Responsive Picture Element: Shows different images based on screen size -->
        <picture class="mit-section__picture">
          <!-- Source for mobile devices (max-width: 600px) -->
          <source
            class="mit-section__picture-source"
            srcset="./MIT1.jpg"
            media="(max-width: 600px)"
          />
          <!-- Fallback image for larger screens -->
          <img
            class="mit-section__picture-img"
            src="./MIT1.jpg"
            alt="MIT image"
          />
        </picture>
        <br /><br />

        <!-- Local Video: MIT video file with controls -->
        <video class="mit-section__video mit-section__video--first" controls>
          <source src="./MIT.mp4" type="video/mp4" />
          <!-- Fallback message if video cannot be played -->
          Your browser does not support the video tag.
        </video>
        <br /><br />

        <iframe width="560" height="315" src="https://www.youtube.com/embed/1b7tpddzacs?si=X6B3BTHlynmLBC0j&amp;controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br /><br />
      </section>

      <!-- Map Section: Displays Google Maps location of MIT -->
      <section class="map-section">
        <!-- Embedded Google Map: Shows MIT campus location -->
        <iframe
          class="map-section__iframe"
          loading="lazy"
          allowfullscreen
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2949.7982170206254!2d-71.09419878454296!3d42.363293229206585!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89e370ac05823573%3A0xa3b713f6c7acfd95!2s500%20Technology%20Square%2C%20Cambridge%2C%20MA%2002139%2C%20USA!5e0!3m2!1sen!2sus!4v1639584729123!5m2!1sen!2sus"
        >
        </iframe>
      </section>
    </main>
  </body>
</html>
